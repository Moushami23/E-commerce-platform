<!DOCTYPE html>
<html>
<head>
    <title>DjangoKart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3f3f3;
        }
        .navbar {
            background-color: #131921;
        }
        .navbar a {
            color: white !important;
        }
        .hero {
            background: url('https://images.unsplash.com/photo-1607082350899-7e105aa886ae');
            background-size: cover;
            height: 300px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
        }
        .hero h1 {
            background: rgba(0,0,0,0.6);
            padding:20px;
            border-radius:10px;
        }
        .card:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg" style="background-color:#131921;">
    <div class="container-fluid text-white">

        <!-- Logo -->
        <a class="navbar-brand text-white fw-bold" href="/">
            DjangoKart
        </a>

        <!-- Search -->
        <form method="GET" action="/" class="d-flex mx-auto" style="width:50%;">
            <input class="form-control" type="search" name="q" placeholder="Search products">
            <button class="btn btn-warning">Search</button>
        </form>

        <!-- Right Side -->
        <div class="d-flex gap-3">

            <a href="#" class="text-white text-decoration-none">
                Hello, sign in <br>
                <strong>Account & Lists</strong>
            </a>

            <a href="#" class="text-white text-decoration-none">
                Returns <br>
                <strong>& Orders</strong>
            </a>

            <a href="/cart/" class="text-white text-decoration-none">
                🛒 Cart
            </a>

        </div>

    </div>
</nav>
<div style="background-color:#232f3e;" class="text-white p-2">
    <div class="container d-flex gap-4">
        <a href="/" class="text-white text-decoration-none">All</a>
        {% for category in categories %}
            <a href="/?category={{ category.id }}" 
               class="text-white text-decoration-none">
               {{ category.name }}
            </a>
        {% endfor %}
    </div>
</div>


<div class="hero">
    <h1>Welcome to DjangoKart</h1>
</div>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
