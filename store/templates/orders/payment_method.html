{% extends 'base.html' %}
{% block content %}

<div class="card p-4 shadow" style="max-width:600px; margin:auto;">
    <h3>Select Payment Method</h3>
    <h5>Total: ₹ {{ total }}</h5>

    <form method="POST">
        {% csrf_token %}

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment_method" value="cod" required>
            <label class="form-check-label">Cash on Delivery (COD)</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment_method" value="card">
            <label class="form-check-label">Credit / Debit Card</label>
        </div>

        <button class="btn btn-warning mt-3">Continue</button>
    </form>
</div>

{% endblock %}
